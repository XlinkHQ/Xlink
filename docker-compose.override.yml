services:
  api:
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command:
      - gunicorn
      - app.main:app
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --timeout
      - "60"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --reload
