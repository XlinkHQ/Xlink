name: xlink

services:
  api:
    image: ghcr.io/${XLINK_IMAGE_OWNER:-xlinkhq}/xlink-api:${XLINK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      XLINK_POSTGRES_HOST: postgres
      XLINK_POSTGRES_PORT: 5432
      XLINK_POSTGRES_USER: ${XLINK_POSTGRES_USER:-xlink}
      XLINK_POSTGRES_PASSWORD: ${XLINK_POSTGRES_PASSWORD:?set XLINK_POSTGRES_PASSWORD in .env (run xlink install)}
      XLINK_POSTGRES_DB: ${XLINK_POSTGRES_DB:-xlink}
      XLINK_REDIS_HOST: redis
      XLINK_REDIS_PORT: 6379
      # Empty by default → entrypoint auto-sizes workers to CPUs (DB-capped).
      # Set WEB_CONCURRENCY in .env to pin it.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      XLINK_WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      # Which upstream proxies uvicorn trusts for X-Forwarded-* (real client IP,
      # proto, host). Empty keeps uvicorn's safe default (127.0.0.1). When the
      # standalone subscription-page is enabled, set this to the compose network
      # (e.g. FORWARDED_ALLOW_IPS=10.0.0.0/8 or the subpage container IP) so the
      # panel reads the REAL client IP through the proxy — device-limit / HWID
      # tracking and the advertised sub-URL host depend on it.
      FORWARDED_ALLOW_IPS: ${XLINK_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${XLINK_PORT:-8000}:8000"
      - "${XLINK_GRPC_PORT:-50051}:50051"
    volumes:
      - /etc/os-release:/host/os-release:ro
      - /usr/lib/os-release:/host/usr/lib/os-release:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Background jobs only: no port is bound, so this scales independently of the
  # API. The leader lock still guards against two workers doing the same work.
  # Omit this service entirely to keep the historical single-process deployment
  # (the api container defaults to XLINK_INSTANCE_ROLE=all).
  worker:
    image: ghcr.io/${XLINK_IMAGE_OWNER:-xlinkhq}/xlink-api:${XLINK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      XLINK_INSTANCE_ROLE: worker
      XLINK_POSTGRES_HOST: postgres
      XLINK_POSTGRES_PORT: 5432
      XLINK_POSTGRES_USER: ${XLINK_POSTGRES_USER:-xlink}
      XLINK_POSTGRES_PASSWORD: ${XLINK_POSTGRES_PASSWORD:?set XLINK_POSTGRES_PASSWORD in .env (run xlink install)}
      XLINK_POSTGRES_DB: ${XLINK_POSTGRES_DB:-xlink}
      XLINK_REDIS_HOST: redis
      XLINK_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/${XLINK_IMAGE_OWNER:-xlinkhq}/xlink-web:${XLINK_IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Secret admin path is baked into the Next.js build (basePath). Empty=root.
        XLINK_WEB_PATH: ${XLINK_WEB_PATH:-}
    restart: unless-stopped
    environment:
      XLINK_API_URL: http://api:8000
      XLINK_WEB_PATH: ${XLINK_WEB_PATH:-}
    ports:
      - "${XLINK_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: ghcr.io/${XLINK_IMAGE_OWNER:-xlinkhq}/xlink-api:${XLINK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      XLINK_POSTGRES_HOST: postgres
      XLINK_POSTGRES_PORT: 5432
      XLINK_POSTGRES_USER: ${XLINK_POSTGRES_USER:-xlink}
      XLINK_POSTGRES_PASSWORD: ${XLINK_POSTGRES_PASSWORD:?set XLINK_POSTGRES_PASSWORD in .env (run xlink install)}
      XLINK_POSTGRES_DB: ${XLINK_POSTGRES_DB:-xlink}
      XLINK_REDIS_HOST: redis
      XLINK_REDIS_PORT: 6379
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${XLINK_POSTGRES_USER:-xlink}
      POSTGRES_PASSWORD: ${XLINK_POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${XLINK_POSTGRES_DB:-xlink}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${XLINK_POSTGRES_USER:-xlink} -d ${XLINK_POSTGRES_DB:-xlink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Edge proxy with automatic HTTPS. Enabled only with the "tls" compose profile
  # (xlink.sh turns it on when a domain is configured); without it the stack
  # serves plain ports for local/IP use.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      XLINK_DOMAIN: ${XLINK_DOMAIN:-}
      XLINK_ACME_EMAIL: ${XLINK_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Standalone subscription page. Enabled only with the "subpage" compose
  # profile (off by default). Serves public /sub/{token} links WITHOUT exposing
  # the panel's domain: it forwards to the panel's INTERNAL endpoint over this
  # private network, so the panel API can be IP-restricted / not publicly
  # exposed while subscription links still resolve on a separate domain.
  #
  # When enabled, point your sub-page domain at this service (port 8081 by
  # default, or terminate TLS in front of it) and set SUB_PAGE_PUBLIC_HOST to
  # that domain — the panel will then advertise subscription URLs on the
  # sub-page domain instead of its own. See subscription-page/README.md.
  subscription-page:
    image: ghcr.io/${XLINK_IMAGE_OWNER:-xlinkhq}/xlink-subscription-page:${XLINK_IMAGE_TAG:-latest}
    build:
      context: ./subscription-page
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["subpage"]
    environment:
      # Panel API on the private network — never needs to be publicly exposed.
      PANEL_INTERNAL_URL: ${SUB_PAGE_PANEL_URL:-http://api:8000}
      PANEL_API_V1_PREFIX: ${XLINK_API_V1_PREFIX:-/api/v1}
      # Public domain clients use to reach THIS service. Advertised to the panel
      # as the subscription URL base so the panel's own domain never leaks.
      SUB_PAGE_PUBLIC_HOST: ${SUB_PAGE_PUBLIC_HOST:-}
      SUB_PAGE_PUBLIC_PROTO: ${SUB_PAGE_PUBLIC_PROTO:-https}
      # Optional shared secret forwarded as X-Sub-Page-Token (panel does not
      # require it today; here for a future panel-side allow rule).
      PANEL_API_TOKEN: ${SUB_PAGE_PANEL_API_TOKEN:-}
    ports:
      - "${SUB_PAGE_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
