syntax = "proto3";

package xlink.agent.v1;

service NodeAgent {
  rpc GetConfig(ConfigRequest) returns (DesiredConfig);
  rpc StreamTraffic(stream TrafficBatch) returns (stream TrafficAck);
  rpc StreamMetrics(stream MetricBatch) returns (stream Ack);
  rpc StreamLogs(stream LogBatch) returns (stream Ack);
  rpc ReportConnections(ConnectionBatch) returns (Ack);
  rpc ReportProviderHealth(ProviderHealthBatch) returns (Ack);
  rpc ReportState(ReportedState) returns (DriftReport);
  rpc LeaseCommands(CommandLeaseRequest) returns (CommandLease);
  rpc SubmitCommandResult(CommandResult) returns (CommandResultAck);
  rpc WatchEvents(EventRequest) returns (stream NodeEvent);
}

message ConfigRequest {
  string node_id = 1;
  string known_version = 2;
}

message DesiredConfig {
  string node_id = 1;
  string config_version = 2;
  string config_json = 3;
  uint32 assignment_count = 4;
}

message TrafficSample {
  string assignment_id = 1;
  uint64 upload_bytes = 2;
  uint64 download_bytes = 3;
  int64 collected_at_unix_ms = 4;
}

message TrafficBatch {
  string node_id = 1;
  string batch_id = 2;
  repeated TrafficSample samples = 3;
}

message TrafficAck {
  string batch_id = 1;
  uint32 received = 2;
  uint32 inserted = 3;
  uint32 duplicates = 4;
  uint32 skipped = 5;
}

message MetricSample {
  string name = 1;
  double value = 2;
  int64 observed_at_unix_ms = 3;
}

message MetricBatch {
  string node_id = 1;
  repeated MetricSample samples = 2;
}

message LogLine {
  string level = 1;
  string message = 2;
  int64 observed_at_unix_ms = 3;
}

message LogBatch {
  string node_id = 1;
  repeated LogLine lines = 2;
}

message ConnectionSample {
  string assignment_id = 1;
  string source_ip = 2;
}

message ConnectionBatch {
  string node_id = 1;
  repeated ConnectionSample samples = 2;
}

message ProviderHealth {
  string provider_name = 1;
  string status = 2;
  double latency_ms = 3;
  string detail = 4;
}

message ProviderHealthBatch {
  string node_id = 1;
  repeated ProviderHealth checks = 2;
}

message ReportedState {
  string node_id = 1;
  string config_version = 2;
  string agent_version = 3;
  string applied_json = 4;
  map<string, string> provider_status = 5;
}

message DriftReport {
  string node_id = 1;
  string severity = 2;
  string desired_version = 3;
  string reported_version = 4;
  string drift_json = 5;
  bool remediated = 6;
}

message CommandLeaseRequest {
  string node_id = 1;
}

message Command {
  string command_id = 1;
  string node_id = 2;
  string kind = 3;
  string payload_json = 4;
  string signature = 5;
  string origin = 6;
  uint32 attempts = 7;
  uint32 max_attempts = 8;
}

message CommandLease {
  string lease_token = 1;
  repeated Command commands = 2;
}

message CommandResult {
  string node_id = 1;
  string command_id = 2;
  string lease_token = 3;
  bool success = 4;
  string result_json = 5;
}

message CommandResultAck {
  string command_id = 1;
  string status = 2;
}

message EventRequest {
  string node_id = 1;
}

message NodeEvent {
  string type = 1;
  string data_json = 2;
}

message Ack {
  uint32 accepted = 1;
  uint32 dropped = 2;
}
