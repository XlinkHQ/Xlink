[project]
name = "xlink"
version = "1.1.0"
description = "Multi-node VPN management panel (FastAPI + PostgreSQL + Redis)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "ParsaGo92" }]
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115.0",
    "anyio>=4.4.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "pyyaml>=6.0.0",
    "cryptography>=43.0.0",
    "segno>=1.6.0",
    "acme>=2.11.0",
    "grpcio>=1.66.0",
    "grpcio-health-checking>=1.66.0",
    "grpcio-reflection>=1.66.0",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.25.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app"]
extend-exclude = ["scale_audit.py", "load_audit.py", "pg_concurrency_audit.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Tests may do blocking disk I/O in async bodies and ignore unpacked values.
"**/tests/**" = ["ASYNC230", "ASYNC240", "RUF059"]
# Inline HTML/CSS/JS templates and User-Agent literals can't be wrapped.
"app/subscription/page.py" = ["E501"]
"app/subscription/formats/xray_json.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "app/tests",
    "app/subscription/tests",
    "app/events/tests",
    "app/agent/tests",
    "app/scheduler/tests",
    "app/failover/tests",
    "app/monitoring/tests",
    "app/backup/tests",
    "app/gitops/tests",
    "app/traffic/tests",
    "app/providers/xray/tests",
]
addopts = "-ra -q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "alembic/*"]
